# Development identity provider overlay.
#
#   docker compose -f deployment/compose/docker-compose.yml \
#                  -f deployment/compose/identity.yml up
#
# Kept in a separate file rather than a profile because Compose interpolates
# the whole file regardless of which services start: a required-variable check
# on Keycloak would otherwise block the base stack for anyone who has not
# configured the identity provider yet.
#
# NETRA never stores passwords (spec §6). Keycloak stands in for the
# organisational identity provider during development.

name: netra

services:
  keycloak:
    image: quay.io/keycloak/keycloak:26.0
    container_name: netra-keycloak
    command: ["start-dev", "--import-realm", "--http-port=8080"]
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: ${KEYCLOAK_ADMIN:?KEYCLOAK_ADMIN must be set in .env}
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:?KEYCLOAK_ADMIN_PASSWORD must be set in .env; run make env}
      KC_HEALTH_ENABLED: "true"
    volumes:
      # The realm is imported from a committed file so the identity provider is
      # reproducible and the demonstration does not depend on manual console
      # configuration. It contains no credentials.
      - ../keycloak:/opt/keycloak/data/import:ro
    ports:
      - "${NETRA_KEYCLOAK_PORT:-8081}:8080"
    healthcheck:
      test: ["CMD-SHELL", "exec 3<>/dev/tcp/127.0.0.1/9000 && echo -e 'GET /health/ready HTTP/1.1\\r\\nHost: localhost\\r\\nConnection: close\\r\\n\\r\\n' >&3 && cat <&3 | grep -q '\"status\": \"UP\"'"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 30s
    restart: unless-stopped

  backend:
    depends_on:
      keycloak:
        condition: service_healthy
